 <!-- Testimonial Start -->
        <div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s">
            <div class="container">
                <h1 class="text-center mb-5">Our Clients Say!!!</h1>
                <div class="owl-carousel testimonial-carousel">
                    {% for client in clients %}
                    
                    <div class="testimonial-item bg-light rounded p-4">
                        <i class="fa {{ client.icon }} fa-2x text-primary mb-3"></i>
                        <p>{{ client.description }}</p>
                        <div class="d-flex align-items-center">
                            <img class="img-fluid flex-shrink-0 rounded" src="{{ client.image.url }}" style="width: 50px; height: 50px;">
                            <div class="ps-3">
                                <h5 class="mb-1">{{ client.name }}</h5>
                                <small>{{ client.title }}</small>
                            </div>
                        </div>
                    </div>
                     {% empty %}
                     <div class="text-center py-4">
            <p class="text-muted">No testimonials available yet.</p>
        </div>
                    {% endfor %}
                    

                </div>
            </div>
        </div>
        <!-- Testimonial End -->
